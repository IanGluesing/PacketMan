<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iptables Packet Flow</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1020;
    --panel: #121a2c;
    --panel2: #17223a;
    --border: #293650;
    --edge: #3a4a68;
    --text: #e5edf9;
    --muted: #8fa2bd;
    --green: #4ade80;
    --red: #fb7185;
    --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 18px 26px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 0; }
  .muted { color: var(--muted); }
  main { max-width: 1700px; margin: auto; padding: 20px; }

  .conn { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); }
  .conn.on { color: var(--green); } .conn.off { color: var(--red); }

  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; min-width: 145px; }
  .stat strong { display: block; font-size: 24px; }
  .stat span { font-size: 12px; color: var(--muted); }

  .section { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .section-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

  #diagramWrap { overflow-x: auto; padding: 8px; }
  svg#diagram { width: 100%; min-width: 1100px; height: auto; display: block; }

  .edge { fill: none; stroke: var(--edge); stroke-width: 2; marker-end: url(#arrow); }
  .node rect { fill: var(--panel2); stroke: var(--border); stroke-width: 1.5; }
  .node.virtual rect { stroke-dasharray: 5 4; fill: transparent; }
  .node.iface rect { fill: #1b2d4a; stroke: #3b5a8a; }
  .node text { fill: var(--text); text-anchor: middle; pointer-events: none; }
  .node .sub { font-size: 10px; fill: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .node .main { font-size: 13px; font-weight: 650; }
  .node .cnt { font-size: 10px; fill: var(--muted); }
  .lane { fill: var(--muted); font-size: 11px; letter-spacing: 1.5px; opacity: .7; }

  .packet-list { display: flex; flex-direction: column; }
  .packet { border-bottom: 1px solid var(--border); }
  .packet:last-child { border-bottom: 0; }
  details > summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: minmax(120px, 1fr) auto; align-items: center; gap: 12px; padding: 13px 18px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary:hover { background: #18243a; }
  .packet-title { font-weight: 650; overflow-wrap: anywhere; }
  .packet-subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .right { display: flex; align-items: center; gap: 12px; }
  .badge { font-size: 11px; font-weight: 750; padding: 5px 9px; border-radius: 6px; letter-spacing: .3px; }
  .badge.DROP { color: #fecdd3; background: #4a1d2e; }
  .badge.ACCEPT { color: #bbf7d0; background: #153b2c; }
  .badge.PASS { color: #bfdbfe; background: #1e3a5f; }
  .arrow { color: var(--muted); transition: transform .15s; }
  details[open] .arrow { transform: rotate(180deg); }
  .details { padding: 0 18px 16px; }
  .trace-line { background: #0b1220; border: 1px solid #24314a; border-radius: 7px; margin-top: 8px; padding: 10px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { padding: 38px 20px; text-align: center; color: var(--muted); }
  button { cursor: pointer; border: 1px solid var(--border); border-radius: 7px; color: var(--text); background: #1a2740; padding: 7px 10px; }
  button:hover { background: #22345a; }
</style>
</head>
<body>
<header>
  <div>
    <h1>iptables Packet Flow</h1>
    <div class="muted">Live netfilter path: interfaces and chains, glowing by verdict</div>
  </div>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <div class="legend">
      <span><i style="background:var(--green)"></i>Accepted</span>
      <span><i style="background:var(--red)"></i>Dropped</span>
      <span><i style="background:var(--blue)"></i>Pass / return</span>
    </div>
    <span id="conn" class="conn off">disconnected</span>
  </div>
</header>

<main>
  <div class="summary">
    <div class="stat"><strong id="acceptedCount">0</strong><span>Accepted packets</span></div>
    <div class="stat"><strong id="droppedCount">0</strong><span>Dropped packets</span></div>
    <div class="stat"><strong id="traceCount">0</strong><span>Completed packets</span></div>
    <div class="stat"><strong id="ifaceCount">0</strong><span>Interfaces</span></div>
  </div>

  <section class="section">
    <div class="section-header">
      <h2>Flow diagram</h2>
      <button id="resetCounters">Reset node counters</button>
    </div>
    <div id="diagramWrap">
      <svg id="diagram" viewBox="0 0 1650 620" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#3a4a68"></path>
          </marker>
        </defs>
        <g id="lanes"></g>
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2>Completed packets</h2>
      <button id="clearButton">Clear list</button>
    </div>
    <div id="packetList" class="packet-list">
      <div class="empty" id="emptyState">Waiting for packets…</div>
    </div>
  </section>
</main>

<script>
(function () {
  const socket = io();
  const NS = "http://www.w3.org/2000/svg";
  const W = 118, H = 42;
  const STEP_MS = 220;
  const GLOW_MS = 3000;
  const COLORS = { ACCEPT: "#4ade80", DROP: "#fb7185", PASS: "#60a5fa" };
  const BASE_EDGE = "#3a4a68";

  const edgesLayer = document.getElementById("edges");
  const nodesLayer = document.getElementById("nodes");
  const lanesLayer = document.getElementById("lanes");
  const svgEl = document.getElementById("diagram");

  const nodes = new Map();  // id -> node
  const edges = new Map();  // "a>b" -> edge
  const adj = new Map();    // id -> Set(ids)

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  // ---------------------------------------------------------------- nodes
  function addNode(id, o) {
    if (nodes.has(id)) return nodes.get(id);
    const g = el("g", { class: "node " + (o.kind || "chain") }, nodesLayer);
    el("rect", { x: -W / 2, y: -H / 2, width: W, height: H, rx: 8, ry: 8 }, g);
    if (o.sub) {
      el("text", { class: "sub", y: -5 }, g).textContent = o.sub;
      el("text", { class: "main", y: 11 }, g).textContent = o.label;
    } else {
      el("text", { class: "main", y: 5 }, g).textContent = o.label;
    }
    const cnt = el("text", { class: "cnt", y: H / 2 + 13 }, g);
    const n = { id, kind: o.kind || "chain", x: o.x, y: o.y, g, rect: g.firstChild, cnt, ok: 0, drop: 0 };
    nodes.set(id, n);
    adj.set(id, adj.get(id) || new Set());
    placeNode(n);
    return n;
  }

  function placeNode(n) {
    n.g.setAttribute("transform", "translate(" + n.x + "," + n.y + ")");
    for (const e of edges.values()) if (e.a === n.id || e.b === n.id) drawEdge(e);
  }

  function renderCounts(n) {
    n.cnt.textContent = n.ok || n.drop ? "\u2713 " + n.ok + "   \u2717 " + n.drop : "";
  }

  function removeNode(id) {
    const n = nodes.get(id);
    if (!n) return;
    for (const [k, e] of [...edges]) {
      if (e.a === id || e.b === id) { e.path.remove(); edges.delete(k); }
    }
    for (const s of adj.values()) s.delete(id);
    adj.delete(id);
    n.g.remove();
    nodes.delete(id);
  }

  // ---------------------------------------------------------------- edges
  function edgePath(a, b) {
    const A = nodes.get(a), B = nodes.get(b);
    if (B.x - A.x >= W - 5) {
      const x1 = A.x + W / 2, y1 = A.y, x2 = B.x - W / 2, y2 = B.y;
      const dx = Math.max(30, (x2 - x1) / 2);
      return "M" + x1 + "," + y1 + " C" + (x1 + dx) + "," + y1 + " " + (x2 - dx) + "," + y2 + " " + x2 + "," + y2;
    }
    const up = B.y < A.y;
    const y1 = A.y + (up ? -H / 2 : H / 2);
    const y2 = B.y + (up ? H / 2 : -H / 2);
    const dy = Math.max(30, Math.abs(y2 - y1) / 2) * (up ? -1 : 1);
    return "M" + A.x + "," + y1 + " C" + A.x + "," + (y1 + dy) + " " + B.x + "," + (y2 - dy) + " " + B.x + "," + y2;
  }

  function drawEdge(e) { e.path.setAttribute("d", edgePath(e.a, e.b)); }

  function addEdge(a, b) {
    const key = a + ">" + b;
    if (edges.has(key) || !nodes.has(a) || !nodes.has(b)) return key;
    const path = el("path", { class: "edge" }, edgesLayer);
    const e = { key, a, b, path };
    edges.set(key, e);
    adj.get(a).add(b);
    drawEdge(e);
    return key;
  }

  // Shortest chain of edges from a to b over the known graph (skipped tables
  // such as an absent raw:PREROUTING are bridged automatically).
  function findPath(a, b) {
    if (a === b) return [];
    const prev = new Map([[a, null]]);
    const queue = [a];
    while (queue.length) {
      const cur = queue.shift();
      if (cur === b) break;
      for (const nx of adj.get(cur) || []) {
        if (!prev.has(nx)) { prev.set(nx, cur); queue.push(nx); }
      }
    }
    if (!prev.has(b)) return [addEdge(a, b)]; // unknown route (e.g. custom chain): draw direct edge
    const keys = [];
    for (let cur = b; prev.get(cur) !== null; cur = prev.get(cur)) keys.unshift(prev.get(cur) + ">" + cur);
    return keys;
  }

  // ---------------------------------------------------------------- static netfilter layout
  const LANE_Y = { ingress: 270, input: 90, forward: 270, output: 450 };
  const CHAINS = [
    // ingress
    ["raw", "PREROUTING", 235, 270], ["mangle", "PREROUTING", 380, 270], ["nat", "PREROUTING", 525, 270],
    // local input (netfilter order: mangle, filter, security, nat)
    ["mangle", "INPUT", 830, 90], ["filter", "INPUT", 975, 90], ["security", "INPUT", 1120, 90], ["nat", "INPUT", 1265, 90],
    // forward
    ["mangle", "FORWARD", 830, 270], ["filter", "FORWARD", 975, 270], ["security", "FORWARD", 1120, 270],
    // output
    ["raw", "OUTPUT", 830, 450], ["mangle", "OUTPUT", 975, 450], ["nat", "OUTPUT", 1120, 450],
    ["filter", "OUTPUT", 1265, 450], ["security", "OUTPUT", 1410, 450],
    // postrouting
    ["mangle", "POSTROUTING", 1265, 270], ["nat", "POSTROUTING", 1410, 270],
  ];

  function init() {
    for (const c of CHAINS) addNode(c[0] + ":" + c[1], { label: c[1], sub: c[0], x: c[2], y: c[3] });
    addNode("ROUTE", { label: "Routing", kind: "virtual", x: 675, y: 270 });
    addNode("LOCAL_IN", { label: "Local process", kind: "virtual", x: 1415, y: 90 });
    addNode("LOCAL_OUT", { label: "Local process", kind: "virtual", x: 675, y: 450 });

    const chainEdges = [
      ["raw:PREROUTING", "mangle:PREROUTING"], ["mangle:PREROUTING", "nat:PREROUTING"], ["nat:PREROUTING", "ROUTE"],
      ["raw:PREROUTING", "ROUTE"],
      ["ROUTE", "mangle:INPUT"], ["mangle:INPUT", "filter:INPUT"], ["filter:INPUT", "security:INPUT"],
      ["security:INPUT", "nat:INPUT"], ["nat:INPUT", "LOCAL_IN"],
      ["ROUTE", "mangle:FORWARD"], ["mangle:FORWARD", "filter:FORWARD"], ["filter:FORWARD", "security:FORWARD"],
      ["security:FORWARD", "mangle:POSTROUTING"],
      ["LOCAL_OUT", "raw:OUTPUT"], ["raw:OUTPUT", "mangle:OUTPUT"], ["mangle:OUTPUT", "nat:OUTPUT"],
      ["nat:OUTPUT", "filter:OUTPUT"], ["filter:OUTPUT", "security:OUTPUT"], ["security:OUTPUT", "mangle:POSTROUTING"],
      ["mangle:POSTROUTING", "nat:POSTROUTING"],
    ];
    for (const e of chainEdges) addEdge(e[0], e[1]);

    const labels = [["PREROUTING", 176, 225], ["INPUT", 771, 45], ["FORWARD", 771, 225], ["POSTROUTING", 1206, 225], ["OUTPUT", 771, 405]];
    for (const l of labels) el("text", { class: "lane", x: l[1], y: l[2] }, lanesLayer).textContent = l[0];
  }

  // ---------------------------------------------------------------- interfaces (dynamic)
  const IFACE_STEP = 52;
  function layoutIfaces() {
    for (const side of ["in", "out"]) {
      const list = [...nodes.values()].filter((n) => n.kind === "iface" && n.id.startsWith(side + ":"));
      list.sort((a, b) => (a.id < b.id ? -1 : 1));
      const total = list.length * IFACE_STEP;
      const start = Math.max(40, 270 - total / 2 + IFACE_STEP / 2);
      list.forEach((n, i) => { n.x = side === "in" ? 75 : 1565; n.y = start + i * IFACE_STEP; placeNode(n); });
    }
    fitViewBox();
    document.getElementById("ifaceCount").textContent =
      [...nodes.keys()].filter((id) => id.startsWith("in:")).length;
  }

  function ensureInterface(name) {
    if (!name || nodes.has("in:" + name)) return;
    addNode("in:" + name, { label: name, sub: "ingress", kind: "iface", x: 75, y: 270 });
    addNode("out:" + name, { label: name, sub: "egress", kind: "iface", x: 1565, y: 270 });
    addEdge("in:" + name, "raw:PREROUTING");
    addEdge("nat:POSTROUTING", "out:" + name);
    layoutIfaces();
  }

  function setInterfaces(list) {
    const names = new Set(list.map((i) => i.name));
    for (const id of [...nodes.keys()]) {
      if (id.startsWith("in:") && !names.has(id.slice(3))) { removeNode(id); removeNode("out:" + id.slice(3)); }
    }
    for (const n of names) ensureInterface(n);
    layoutIfaces();
  }

  // ---------------------------------------------------------------- custom chains (e.g. DOCKER-USER)
  let customCount = 0;
  function ensureChainNode(table, chain) {
    const id = table + ":" + chain;
    if (nodes.has(id)) return id;
    const i = customCount++;
    const label = chain.length > 15 ? chain.slice(0, 14) + "\u2026" : chain;
    addNode(id, { label, sub: table + " (custom)", x: 235 + (i % 10) * 145, y: 560 + Math.floor(i / 10) * 70 });
    fitViewBox();
    return id;
  }

  function fitViewBox() {
    let maxY = 620;
    for (const n of nodes.values()) maxY = Math.max(maxY, n.y + 60);
    svgEl.setAttribute("viewBox", "0 0 1650 " + maxY);
  }

  // ---------------------------------------------------------------- playback
  function cls(v) { return v === "ACCEPT" || v === "DROP" ? v : "PASS"; }

  function flashEdge(key, verdict) {
    const e = edges.get(key);
    if (!e) return;
    const c = COLORS[verdict];
    const lit = { stroke: c, strokeWidth: "4px", filter: "drop-shadow(0 0 7px " + c + ")" };
    const base = { stroke: BASE_EDGE, strokeWidth: "2px", filter: "drop-shadow(0 0 0 transparent)" };
    e.path.animate([lit, Object.assign({ offset: 0.6 }, lit), base], { duration: GLOW_MS, easing: "ease-out" });
  }

  function flashNode(id, verdict) {
    const n = nodes.get(id);
    if (!n) return;
    const c = COLORS[verdict];
    const lit = { stroke: c, strokeWidth: "3px", filter: "drop-shadow(0 0 9px " + c + ")" };
    const base = { stroke: "", strokeWidth: "1.5px", filter: "drop-shadow(0 0 0 transparent)" };
    // Use the node's computed stroke as the end state so each node style is restored.
    base.stroke = getComputedStyle(n.rect).stroke;
    n.rect.animate([lit, Object.assign({ offset: 0.6 }, lit), base], { duration: GLOW_MS, easing: "ease-out" });
  }

  // Merge consecutive hops in the same chain (several rules + policy).
  function buildSteps(packet) {
    ensureInterface(packet.in);
    ensureInterface(packet.out);

    let prev = packet.in ? "in:" + packet.in : "LOCAL_OUT";
    const steps = [{ node: prev, verdict: null, edges: [] }];

    for (const hop of packet.hops) {
      const id = ensureChainNode(hop.table, hop.chain);
      if (id === prev) {
        const s = steps[steps.length - 1];
        if (hop.verdict === "DROP" || (hop.verdict && s.verdict !== "DROP")) s.verdict = hop.verdict;
        continue;
      }
      steps.push({ node: id, verdict: hop.verdict, chain: hop.chain, edges: findPath(prev, id) });
      prev = id;
    }

    const last = steps[steps.length - 1];
    if (last.verdict === "ACCEPT") {
      let target = null;
      if (last.chain === "INPUT") target = "LOCAL_IN";
      else if (last.chain === "POSTROUTING" && packet.out) target = "out:" + packet.out;
      if (target && nodes.has(target)) steps.push({ node: target, verdict: "ACCEPT", edges: findPath(prev, target), terminal: true });
    }
    return steps;
  }

  function play(packet, count) {
    const steps = buildSteps(packet);
    steps.forEach(function (s, i) {
      setTimeout(function () {
        const v = cls(s.verdict || "PASS");
        const useV = i === 0 ? "PASS" : v;
        for (const k of s.edges) flashEdge(k, useV);
        flashNode(s.node, useV);
        if (count && !s.terminal && i > 0 && (v === "ACCEPT" || v === "DROP")) {
          const n = nodes.get(s.node);
          if (v === "ACCEPT") n.ok++; else n.drop++;
          renderCounts(n);
        }
      }, i * STEP_MS);
    });
  }

  // ---------------------------------------------------------------- packet list
  const packetList = document.getElementById("packetList");
  const packets = new Map();

  function updateCounts() {
    let a = 0, d = 0;
    for (const p of packets.values()) { if (p.verdict === "ACCEPT") a++; if (p.verdict === "DROP") d++; }
    document.getElementById("acceptedCount").textContent = a;
    document.getElementById("droppedCount").textContent = d;
    document.getElementById("traceCount").textContent = packets.size;
  }

  function describe(p) {
    const i = p.info || {};
    const flow = i.SRC && i.DST ? i.SRC + (i.SPT ? ":" + i.SPT : "") + " \u2192 " + i.DST + (i.DPT ? ":" + i.DPT : "") : "";
    return ["Family " + p.family, (p.in || "local") + " \u2192 " + (p.out || "\u2014"), i.PROTO || "", flow, p.hops.length + " hops", p.time]
      .filter(Boolean).join(" \u00b7 ");
  }

  function addToList(p) {
    const empty = document.getElementById("emptyState");
    if (empty) empty.remove();

    const details = document.createElement("details");
    details.className = "packet";

    const summary = document.createElement("summary");
    const left = document.createElement("div");
    const title = document.createElement("div");
    title.className = "packet-title";
    title.textContent = "Packet " + p.hash;
    const sub = document.createElement("div");
    sub.className = "packet-subtitle";
    sub.textContent = describe(p);
    left.append(title, sub);

    const right = document.createElement("div");
    right.className = "right";
    const badge = document.createElement("span");
    badge.className = "badge " + p.verdict;
    badge.textContent = p.verdict;
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "\u2304";
    right.append(badge, arrow);
    summary.append(left, right);

    const body = document.createElement("div");
    body.className = "details";
    const replay = document.createElement("button");
    replay.textContent = "Replay in diagram";
    replay.addEventListener("click", function () { play(p, false); });
    const path = document.createElement("div");
    path.className = "packet-subtitle";
    path.style.margin = "10px 0 0";
    path.textContent = p.hops.map(function (h) { return h.table + ":" + h.chain + (h.verdict ? " (" + h.verdict + ")" : ""); }).join("  \u2192  ");
    const lines = document.createElement("div");
    lines.className = "trace-line";
    lines.textContent = p.lines.map(function (e) { return e.type + ": " + e.line; }).join("\n");
    body.append(replay, path, lines);

    details.append(summary, body);
    packetList.prepend(details);
    packets.set(p.id, p);
    updateCounts();
  }

  // ---------------------------------------------------------------- socket wiring
  const conn = document.getElementById("conn");
  socket.on("connect", function () { conn.textContent = "connected"; conn.className = "conn on"; });
  socket.on("disconnect", function () { conn.textContent = "disconnected"; conn.className = "conn off"; });

  socket.on("interfaces", setInterfaces);

  socket.on("history", function (list) {
    for (const p of list) if (!packets.has(p.id)) { ensureInterface(p.in); ensureInterface(p.out); addToList(p); }
  });

  socket.on("completed-packet", function (p) {
    addToList(p);
    play(p, true);
  });

  document.getElementById("clearButton").addEventListener("click", function () {
    packets.clear();
    packetList.replaceChildren();
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.id = "emptyState";
    empty.textContent = "Waiting for packets\u2026";
    packetList.appendChild(empty);
    updateCounts();
  });

  document.getElementById("resetCounters").addEventListener("click", function () {
    for (const n of nodes.values()) { n.ok = 0; n.drop = 0; renderCounts(n); }
  });

  init();
})();
</script>
</body>
</html>
