
name: packetman
arch: arm64
platform: linux
version: 0.1.1
maintainer: Ian Gluesing
description: Linux packet tracing and visualization
license: MIT

depends:
  - nodejs

contents:
  - src: ./app.js
    dst: /usr/lib/packetman/app.js
  - src: ./index.html
    dst: /usr/lib/packetman/index.html

  - src: ./node_modules/
    dst: /usr/lib/packetman/node_modules/
    type: tree

  - src: ./scripts/packetman
    dst: /usr/bin/packetman
    file_info:
      mode: 0755
